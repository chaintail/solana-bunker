<script>
const f = window.__film, $ = (id) => document.getElementById(id);
// ---------- characters: s09 bodies (oval erased), one keyed head still each, head BEHIND the body (key chin (338,905), k = 0.326 key px per body px)
const HK = 0.326, AN = window.ANCHORS_S09;
function fig(parent, pose, head, x, y, s, flip = 1) {   // (x, y) = chin point on screen, s = body scale
  const a = AN[pose], el = document.createElement('div'); el.className = 'fig';
  el.innerHTML = `<img class="h" src="heads/${head}" style="width:${760 * HK}px;height:${1100 * HK}px;left:${a.cx - 338 * HK}px;top:${a.chin + 3 - 905 * HK}px"><img src="assets/s09/${pose}.png" width="1024" height="1536">`;
  el.style.transform = `translate(${x}px,${y}px) scale(${s * flip},${s}) translate(${-a.cx}px,${-a.chin}px)`; parent.appendChild(el); return el; }
// ---------- panel A: Joe behind the table, hands in pockets (frozen pose), head = take 501.85 s ("thousand"); the sticky notes
const JOE = { x: 470, y: 300, s: .56 };
fig($('joeL'), 'street-hands-in-pockets', 's09-look-joe.png', JOE.x, JOE.y, JOE.s);
const R = f.rng(9), N = () => 1 + Math.floor(R() * 999);
const note = (x, y, rot, size, n, cls = '') => `<div class="note ${cls}" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .2)}px;transform:translate(${x - size / 2}px,${y - size / 2}px) rotate(${rot}deg)">secret_${n}</div>`;
const col = () => { const r = R(); return r < .14 ? 'p' : r < .26 ? 'b' : ''; };
{ let h = '';   // on the fridge, cabinets and the backsplash
  for (const [x0, y0, x1, y1, k] of [[812, 120, 950, 700, 14], [10, 20, 310, 220, 7], [0, 336, 300, 436, 4], [600, 336, 790, 436, 3]]) for (let i = 0; i < k; i++) h += note(x0 + R() * (x1 - x0), y0 + R() * (y1 - y0), (R() - .5) * 26, 58 + R() * 14, N(), col());
  $('wallNotes').innerHTML = h; }
{ let h = '';   // the pile on the table: a mound in front of Joe
  for (let i = 0; i < 120; i++) { const x = 150 + R() * 660, top = 560 - 120 * Math.exp(-(((x - 470) / 190) ** 2)), y = top + R() * (575 - top); h += note(x, y, (R() - .5) * 70, 64 + R() * 18, N(), col()); }
  h += note(330, 548, -12, 96, 2) + note(612, 556, 9, 96, 1);
  $('pile').innerHTML = h; }
{ let h = '';   // the rain, mid-fall (falling notes flutter: a little skew), plus two big ones close to the lens
  for (let i = 0, k = 0; k < 24 && i < 400; i++) { const x = 20 + R() * 920, y = -20 + R() * 470;
    if (Math.abs(x - JOE.x) < 170 && y > 90 && y < 480) continue;   // keep Joe's face and chest clear: he lip-syncs
    if (x > 545 && x < 815 && y > 40 && y < 300 && R() < .7) continue;   // and most of the window
    k++; h += note(x, y, (R() - .5) * 90, 58 + R() * 20, N(), col()).replace('rotate(', `skewX(${((R() - .5) * 24).toFixed(1)}deg) rotate(`); }
  h += note(150, 300, -18, 150, 1000) + note(840, 118, 14, 132, 734, 'p');
  // the one stuck to his forehead (forehead about 110 px above the chin at this scale)
  h += `<div class="note" style="width:56px;height:56px;font-size:11px;transform:translate(${JOE.x - 7 - 28}px,${JOE.y - 116 - 28}px) rotate(-9deg)">secret_42</div>`;
  $('rain').innerHTML = h; }
// grain: seeded per frame (the scene redraws it every frame; the still uses frame 15)
function grain(fr) { const c = $('grain').getContext('2d'), im = c.createImageData(480, 360), r = f.rng(1000 + fr);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.floor(r() * 255); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 150; } c.putImageData(im, 0, 0); }
// ---------- panel B: rays, the key grid, the words, the suit, QR cards
{ let g = ''; const cx = 690, cy = 330, n = 28; for (let i = 0; i < n; i += 2) { const a0 = (i / n) * Math.PI * 2 + .05, a1 = ((i + 1) / n) * Math.PI * 2 + .05, L = 1600;
    g += `<polygon points="${cx},${cy} ${cx + L * Math.cos(a0)},${cy + L * Math.sin(a0)} ${cx + L * Math.cos(a1)},${cy + L * Math.sin(a1)}" fill="#2c4ce0"/>`; } $('rays').innerHTML = g; }
{ // a thousand key cards (scene 7's Lamport key card, miniature), fanned out from the golden key at (950, 125): alpha falls off with distance
  const c = $('keys').getContext('2d'), O = [950, 125], PX = 36, PY = 24, W = 30, H = 19; let n = 0;
  for (let j = -6; j < 28; j++) for (let i = -28; i < 10; i++) { const x = O[0] + i * PX - W / 2, y = O[1] + j * PY - H / 2; if (x > 1290 || y > 730 || x < -40 || y < -30) continue;
    const d = Math.hypot(i * PX, j * PY); if (d < 40) continue; n++;
    c.globalAlpha = .06 + .6 * Math.exp(-d / 430);
    c.fillStyle = '#f1e7cc'; c.fillRect(x, y, W, H); c.strokeStyle = '#2a2418'; c.lineWidth = 1.5; c.strokeRect(x + .75, y + .75, W - 1.5, H - 1.5);
    c.beginPath(); c.arc(x + 8, y + H / 2, 3.2, 0, Math.PI * 2); c.moveTo(x + 11.2, y + H / 2); c.lineTo(x + 25, y + H / 2); c.moveTo(x + 22, y + H / 2); c.lineTo(x + 22, y + H / 2 + 4); c.lineWidth = 1.6; c.stroke(); }
  c.globalAlpha = 1; console.log('key cards', n); }
{ const W = window.S09_WORDS; let h = '';
  for (let k = 0; k < 24; k++) { const cl = Math.floor(k / 12), r = k % 12; h += `<div class="w" style="left:${14 + cl * 178}px;top:${58 + r * 27.5}px"><i>${k + 1}.</i><span>${W[k]}</span></div>`; }
  $('words').innerHTML = h;
  // ragged parchment edge (seeded)
  const r = f.rng(39), p = []; const step = 14;
  for (let x = 0; x <= 370; x += step) p.push(`${x}px ${(r() * 5).toFixed(1)}px`);
  for (let y = step; y <= 392; y += step) p.push(`${(370 - r() * 5).toFixed(1)}px ${y}px`);
  for (let x = 370 - step; x >= 0; x -= step) p.push(`${x}px ${(392 - r() * 5).toFixed(1)}px`);
  for (let y = 392 - step; y > 0; y -= step) p.push(`${(r() * 5).toFixed(1)}px ${y}px`);
  $('parchBg').style.clipPath = `polygon(${p.join(',')})`; }
