<!doctype html><html data-duration="40" data-fps="30"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="fonts.css">
<style>
/* Look draft for scene 11 (film-plan-ending.md part C), not the scene: the split screen after the Chaintail News Network ident.
   LEFT third (0-427 px): the CNN panel in the news desk's palette, logo block on top, the credits rolling up beneath it at 5 px a frame
   (150 px/s) from t = 3.60 s. RIGHT two thirds: the parchment vault outro card (the deck's closing slide, C9Close.tsx): Chaintail Labs R&D /
   Solana Vault, the GitHub and Telegram codes with their logos and links beneath, "Feel free to reach out with any questions!".
   Credits text: data/s11-credits.js (one block). Codes: data/s11-qr.js (pipeline/s11/qr.mjs). */
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#05070d}
#panel{position:absolute;left:0;top:0;width:427px;height:720px;overflow:hidden;background:radial-gradient(ellipse 90% 60% at 50% 0%,#244a80 0%,#0d1830 55%,#05070d 100%)}
#swirl{position:absolute;inset:-200px;background:conic-gradient(from 30deg at 50% 50%,rgba(227,6,19,.0),rgba(227,6,19,.16),rgba(127,166,255,.12),rgba(36,74,128,.0),rgba(227,6,19,.10),rgba(227,6,19,0));filter:blur(30px)}
#head{position:absolute;left:0;top:0;width:427px;height:206px;z-index:3;background:linear-gradient(180deg,#0d1830 0%,#0d1830 78%,rgba(13,24,48,0) 100%)}
#head img{position:absolute;left:44px;top:26px;height:96px}
#head .cnn{position:absolute;left:158px;top:22px;font:700 104px/1 Oswald;letter-spacing:.04em;color:#fff;text-shadow:0 4px 0 #b8000a}
#head .net{position:absolute;left:0;right:0;top:142px;text-align:center;font:800 19px/1 Inter;letter-spacing:.28em;color:#c9d6f2}
#head .rule{position:absolute;left:30px;right:30px;top:176px;height:5px;background:#e30613;box-shadow:0 0 12px rgba(227,6,19,.8)}
#win{position:absolute;left:0;top:190px;width:427px;height:530px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 40px,#000 calc(100% - 30px),transparent 100%)}
#roll{position:absolute;left:0;top:0;width:427px}
.cr{text-align:center;margin:0 0 30px}
.cr .r{font:700 34px/1.1 Oswald;letter-spacing:.06em;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.7)}
.cr .n{font:700 25px/1.3 Inter;color:#c9d6f2;letter-spacing:.01em;padding:0 22px}
.cr .s{margin-top:8px;font:700 30px/1.1 Oswald;letter-spacing:.06em;color:#ffd400;text-shadow:0 3px 8px rgba(0,0,0,.7)}
.cr .j{font:italic 700 24px/1.3 Inter;color:#ffd400;padding:0 26px}
#div{position:absolute;left:424px;top:0;width:6px;height:720px;background:#e30613;box-shadow:0 0 18px rgba(227,6,19,.9);z-index:4}
/* the parchment card */
#parch{position:absolute;left:430px;top:0;width:850px;height:720px;overflow:hidden;background:radial-gradient(ellipse 75% 70% at 50% 44%,#f7f1e3 0%,#efe7d4 55%,#d9c79d 100%)}
#parch .brand{position:absolute;left:58px;top:40px;color:#1c1a17}
#parch .b1{font:700 62px/1 'Playfair Display';letter-spacing:-.005em}
#parch .b2{margin-top:8px;font:italic 400 44px/1 'Liberation Serif';color:#4c463d}
#parch .lemur{position:absolute;right:52px;top:30px;height:128px}
#parch .q{position:absolute;top:212px;width:390px;text-align:center;color:#1c1a17}
#parch .q svg.code{display:block;margin:0 auto;box-shadow:0 16px 26px -16px rgba(55,38,10,.6);outline:1.5px solid rgba(28,26,23,.5)}
#parch .q .lk{margin-top:16px;font:400 19px/1 'Special Elite';white-space:nowrap}
#parch .q .lk svg{width:30px;height:30px;vertical-align:-8px;margin-right:8px}
#parch .ask{position:absolute;left:0;right:0;top:560px;text-align:center;font:italic 400 40px/1.15 'Liberation Serif';color:#1c1a17}
#parch .sig{position:absolute;left:0;right:0;top:640px;text-align:center;font:400 17px/1 'Special Elite';letter-spacing:.16em;color:#8a8170}
</style></head><body>
<div id="panel"><div id="swirl"></div>
  <div id="head"><img src="assets/chaintail-logo-white.svg"><div class="cnn">CNN</div><div class="net">CHAINTAIL NEWS NETWORK</div><div class="rule"></div></div>
  <div id="win"><div id="roll"></div></div>
</div>
<div id="parch">
  <svg width="850" height="720" style="position:absolute;left:0;top:0;opacity:.2;mix-blend-mode:multiply"><filter id="fib"><feTurbulence type="fractalNoise" baseFrequency=".9 .22" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .08  0 0 0 1.4 -.35"/></filter><rect width="850" height="720" filter="url(#fib)"/></svg>
  <div class="brand"><div class="b1">Chaintail Labs R&amp;D</div><div class="b2">Solana Vault</div></div>
  <img class="lemur" src="assets/chaintail-logo.svg">
  <div class="q" id="qGh" style="left:24px"></div>
  <div class="q" id="qTg" style="left:436px"></div>
  <div class="ask">Feel free to reach out with any questions!</div>
</div>
<div id="div"></div>
<script src="data/s11-credits.js"></script><script src="data/s11-qr.js"></script>
<script src="lib/film.js"></script>
<script>
const f = window.__film, $ = (id) => document.getElementById(id), C = window.S11_CREDITS, Q = window.S11_QR;
// heading, then one name per line; CAST / VOICE ACTORS lines are [sub-role, name]; {joke} lines are free italics
$('roll').innerHTML = C.roll.map((b) => b.joke ? `<div class="cr"><div class="j">${b.joke}</div></div>` :
  `<div class="cr"><div class="r">${b[0]}</div>${b[1].map((x) => Array.isArray(x) ? `<div class="s">${x[0]}</div><div class="n">${x[1]}</div>` : `<div class="n">${x}</div>`).join('')}</div>`).join('');
// codes at whole pixels per module with the 4-module quiet zone, on the parchment's paper colour
const code = (q, px) => { const s = (q.n + 8) * px; return `<svg class="code" viewBox="-4 -4 ${q.n + 8} ${q.n + 8}" width="${s}" height="${s}" shape-rendering="crispEdges"><rect x="-4" y="-4" width="${q.n + 8}" height="${q.n + 8}" fill="#f7f1e3"/><path d="${q.d}" fill="#1c1a17"/></svg>`; };
const GH = '<svg viewBox="0 0 24 24"><path fill="#1c1a17" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>';
const TG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#229ed9"/><path d="M5.3,11.7 L17.4,7.0 C18.0,6.8 18.5,7.1 18.3,7.9 L16.3,17.2 C16.2,17.8 15.7,18.0 15.2,17.7 L12.1,15.4 L10.6,16.8 C10.4,17.0 10.3,17.1 10.0,17.1 L10.2,13.9 L15.9,8.8 C16.2,8.6 15.8,8.5 15.5,8.7 L8.5,13.1 L5.4,12.2 C4.8,12.0 4.8,11.8 5.3,11.7 Z" fill="#fff"/></svg>';
$('qGh').innerHTML = code(Q.repo, 7) + `<div class="lk">${GH}github.com/chaintail/solana-bunker</div>`;
$('qTg').innerHTML = code(Q.tg, 8) + `<div class="lk">${TG}t.me/chaintail</div>`;
// the roll: starts below the window at 3.60 s, 5 px a frame (150 px/s, whole pixels, no shimmer)
const T0 = 3.6, PXF = 5;
f.onSeek((t) => { const fr = Math.max(0, Math.round((t - T0) * 30)); $('roll').style.transform = `translateY(${530 - PXF * fr}px)`;
  $('swirl').style.transform = `rotate(${(t * 9).toFixed(2)}deg)`; });
</script></body></html>
