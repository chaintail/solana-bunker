      if (t >= t0 + 4.6) { const k = t < t0 + 4.67 ? 3 : 2; text(F, 'ROTATE', 268 - Math.ceil(tw('ROTATE', k) / 2), 166, '#ff2030', k); } }

}

// ---------- seek
const coinPath = [[352, 300], [452, 282], [540, 404], [598, 560], [612, 664]];

  const k = t < .25 ? 2 : lerp(2, 1, 1 - Math.pow(1 - P(t, .25, .6), 3)), px = lerp(640, 670, (2 - k)), py = lerp(360, 336, (2 - k));

  let dx = 0, dy = 0; const sh = (t0, n, a) => { const fr = Math.floor((t - t0) * 30 + 1e-6); if (fr >= 0 && fr < n) { const r = f.rng(Math.round(t0 * 100) + fr); dx = Math.round((r() - .5) * 2 * a) * 4; dy = Math.round((r() - .5) * 2 * a) * 4; } };
  sh(T.xmss + .42, 2, 1); sh(T.awesome + .42, 2, 1); sh(T.transaction + .2, 6, 2); sh(T.cool, 3, 1);
  $('crtIn').style.transform = `translate(${dx}px,${dy}px) scaleY(${sy})`; $('crtIn').style.filter = br !== 1 ? `brightness(${br})` : 'none';
  $('white').style.opacity = String(wh);
  $('flash').style.opacity = String(t >= T.limit && t < T.limit + .25 ? .55 * (1 - P(t, T.limit, T.limit + .25)) : 0);
  // playfield, mosaic load, glow
  draw(t);
  if (t >= .75 && t < 1.2) { const b = [16, 8, 4, 2][Math.min(3, Math.floor((t - .75) / .1125))];
    tc.imageSmoothingEnabled = true; tc.clearRect(0, 0, 160, 120); tc.drawImage($('pf'), 0, 0, 160 / b, 120 / b);
    pf.imageSmoothingEnabled = false; pf.drawImage(tmp, 0, 0, 160 / b, 120 / b, 0, 0, 160, 120); }
  gl.imageSmoothingEnabled = false; gl.clearRect(0, 0, 320, 240); gl.drawImage($('pf'), 0, 0, 320, 240); gl.drawImage($('fine'), 0, 0);
  // coin door light: blinks with INSERT COIN, bright when the coin goes in
  const blink = t >= T.c1end + .05 && t < T.oh + .45 ? Math.floor((t - T.c1end) * 6) % 2 === 0 : false, hit = t >= T.oh + .45 && t < T.oh + .8;
  $('slotLit').setAttribute('fill', hit || blink ? '#ff5a66' : '#e01b2b'); $('slotGlow').setAttribute('opacity', hit ? '.75' : blink ? '.55' : '.22');
  // coin: from the engineer's glove to the slot in 4 stop-frame positions
  const cv = t >= T.oh && t < T.oh + .5; show($('coin'), cv);
  if (cv) { const i = Math.min(4, Math.floor((t - T.oh) / .1)); $('coin').style.transform = `translate(${coinPath[i][0] - 15}px,${coinPath[i][1] - 15}px)`; }
  // cards: 003-A + "local SVM only" -> 003-B + see-the-code (line 118) + proof (CiZmcGsa...)
  const cIn = (el, t0, d = .2) => { if (t < t0) { show(el, false); return; } show(el, true); const p = P(t, t0, t0 + d); el.style.transform = `scale(${p < 1 ? (p < .6 ? lerp(.2, 1.08, p / .6) : lerp(1.08, 1, (p - .6) / .4)) : 1})`; };
  cIn($('prog'), T.tempacct);
  if (t < T.so + .8) { cIn($('stat'), T.tempacct + .3); } else { const p = P(t, T.so + .8, T.so + 1.0); show($('stat'), p < 1); $('stat').style.transform = `scale(${1 - p})`; }
  { const p = P(t, T.so, T.so + .35), a = $('sufA'); show(a, p < 1); a.style.transform = `translate(${110 * p}px,${-90 * p + 160 * p * p}px) rotate(${220 * p}deg)`;
    const b = $('sufB'), q = P(t, T.so + .35, T.so + .8); show(b, t >= T.so + .35); b.style.transform = `translate(${lerp(140, 0, Math.min(1, q / .6))}px,0) scale(${q < .6 ? lerp(1.7, .9, q / .6) : lerp(.9, 1, (q - .6) / .4)})`; }

  // engineer: speaks every E line; frozen head-down tilt after "limit" (no facepalm pose); thumbs-up from "verifies"

  const pk = (a, b) => (t < a || t >= b + .15 ? -1 : t < a + .15 ? step(P(t, a, a + .15), 3) : t < b ? 1 : 1 - step(P(t, b, b + .15), 3));
