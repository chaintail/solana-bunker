<!doctype html><html data-duration="44.4" data-fps="30"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="fonts.css">
<style>
/* Two layers are rendered separately and composited around the matted footage on dev-mac:
     ?layer=back  studio backdrop (static; one still is enough)
     ?layer=front desk, bugs, lower third, over-the-shoulder box, tweet card, chyron, flash, wipe (transparent PNGs)
   no ?layer  both together (previews only) */
html,body{font-family:'Inter',sans-serif;color:#fff}
body.layer-front .back,body.layer-back .front{display:none}
html:not([data-layer]) body,html[data-layer="back"] body{background:#05070d}
/* ---------- back: studio ---------- */
.studio{position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 40%,#244a80 0%,#0d1830 50%,#05070d 100%)}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 200deg at 50% 30%,rgba(120,170,255,.07) 0 4deg,transparent 4deg 11deg);mask-image:radial-gradient(ellipse 60% 60% at 50% 30%,#000,transparent)}
.sky{position:absolute;left:0;right:0;top:120px;height:420px}
.sky i{position:absolute;bottom:0;background:#0a1226;border-top:2px solid rgba(120,170,255,.25)}
.sky b{position:absolute;width:5px;height:7px;background:#ffd98a;opacity:.7}
.moon{position:absolute;left:1010px;top:130px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#bcd2ff 60%,#6f8fd0);box-shadow:0 0 60px rgba(160,200,255,.55)}
.glass{position:absolute;left:0;right:0;top:0;height:560px;background:linear-gradient(90deg,rgba(20,40,80,.0),rgba(60,110,200,.10) 50%,rgba(20,40,80,0))}
.mullion{position:absolute;top:0;height:560px;width:10px;background:linear-gradient(90deg,#060a14,#16233f,#060a14)}
.sign{position:absolute;left:50%;top:40px;transform:translateX(-50%);font:700 28px/1 'Oswald';letter-spacing:.5em;color:rgba(190,215,255,.55)}
/* ---------- front ---------- */
.desk{position:absolute;left:0;right:0;top:545px;height:175px;background:linear-gradient(180deg,#2a3a5c 0,#16213a 8%,#0b1224 40%,#070b17 100%);border-top:5px solid #7fa6ff;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.desk:after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.55)}
.deskfront{position:absolute;left:290px;width:700px;top:604px;height:5px;background:#2a3a5c;opacity:0}
.live{position:relative;top:14px;display:flex;align-items:center;gap:10px;font:800 26px/1 'Inter';letter-spacing:.14em;padding-right:16px;margin-right:2px;border-right:3px solid rgba(255,255,255,.55)}
.live .dot{width:18px;height:18px;border-radius:50%;background:#e30613;box-shadow:0 0 14px #e30613}
.live.tl{position:absolute;left:36px;top:30px;border:0;padding:0}
.l3{position:absolute;left:36px;bottom:104px;width:880px;height:84px;display:flex;align-items:stretch;box-shadow:0 12px 30px rgba(0,0,0,.55);overflow:hidden}
.l3 .tag{background:#fff;color:#e30613;font:800 30px/84px 'Inter';padding:0 22px;letter-spacing:.06em;min-width:180px;text-align:center}
.l3 .bar{flex:1;background:linear-gradient(180deg,#f2141f,#b8000a);font:700 48px/84px 'Oswald';padding:0 24px;letter-spacing:.02em;white-space:nowrap}
.l3sub{position:absolute;left:36px;bottom:70px;width:880px;height:36px;background:rgba(10,14,24,.94);font:700 22px/36px 'Inter';padding:0 20px;letter-spacing:.03em;color:#e8eefa;white-space:nowrap}
.ticker{position:absolute;left:0;right:0;bottom:0;height:56px;background:#f4f5f7;display:flex;align-items:center;box-shadow:0 -4px 14px rgba(0,0,0,.4);overflow:hidden}
.ticker .lbl{position:relative;z-index:2;height:100%;background:#0d1830;color:#fff;font:800 22px/56px 'Inter';padding:0 20px;letter-spacing:.12em;white-space:nowrap}
.ticker .win{position:relative;flex:1;height:100%;overflow:hidden}
.ticker .run{position:absolute;left:0;top:0;height:100%;white-space:nowrap;font:700 28px/56px 'Inter';color:#141821;will-change:transform}
.ticker .run span{display:inline-block;padding-right:0}
.ticker .run b{color:#e30613;margin:0 22px}
/* over-the-shoulder box */
.ots{position:absolute;right:36px;top:36px;width:410px;height:230px;border:5px solid #fff;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.6);overflow:hidden;transform-origin:100% 0}
.ots .pan{position:absolute;left:0;top:0;width:410px;height:230px;transform-origin:0 0}
.ots img{position:absolute;left:0;top:0;width:410px;height:230px;display:block}
.ots svg.pen{position:absolute;left:0;top:0;width:410px;height:230px;overflow:visible}
.ots svg.pen path{fill:none;stroke:#ff1f2d;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.otstag{position:absolute;right:36px;top:36px;transform:translateY(-100%);background:#e30613;font:800 18px/1 'Inter';letter-spacing:.14em;padding:6px 12px;opacity:0}
/* tweet component (rev 4): real header (assets/tweet-header-v4.jpg) and real footer (assets/tweet-footer.jpg) are fixed, the real body (assets/tweet-body.jpg) scrolls between them */
.tweet{position:absolute;left:24px;top:26px;width:430px;background:#000;border:1px solid #3a3f45;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6);overflow:hidden}
.tweet .thead,.tweet .tfoot{display:block;width:428px;height:auto;position:relative;z-index:2;background:#000}
.tweet .tfoot{border-top:1px solid #2a2f35}
.tweet .twin{position:relative;width:428px;height:358px;overflow:hidden;border-top:1px solid #1d2126}
.tweet .tscroll{position:absolute;left:0;top:0;width:428px;will-change:transform}
.tweet .tinner{position:relative;width:1290px;transform-origin:0 0;transform:scale(.33178)}
.tweet .tinner img{display:block;width:1290px}
.tweet .hlg{position:absolute;left:0;top:0;width:1290px;height:1px}
.tweet .hl{position:absolute;background:rgba(255,214,0,.42);border-radius:6px;transform-origin:0 50%;mix-blend-mode:screen}
.tweet .twin:before,.tweet .twin:after{content:"";position:absolute;left:0;right:0;height:14px;z-index:3;pointer-events:none}
.tweet .twin:before{top:0;background:linear-gradient(0deg,transparent,rgba(0,0,0,.85))}
.tweet .twin:after{bottom:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85))}
/* channel bug */
.chbug{position:absolute;right:26px;bottom:122px;display:flex;align-items:center;gap:12px;color:#fff;opacity:0;filter:drop-shadow(0 3px 8px rgba(0,0,0,.65))}
.chbug img{height:50px;display:block}
.chbug span{font:700 52px/1 'Oswald';letter-spacing:.06em}
.qday{position:absolute;right:36px;top:36px;width:410px;height:230px;border:5px solid #fff;background:radial-gradient(ellipse at 50% 40%,#244a80,#0d1830 75%);box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
.qday b{font:700 104px/1 'Oswald';letter-spacing:.04em;color:#fff}
.qday i{font:800 italic 44px/1 'Inter';color:#ff3b47;margin-top:8px;letter-spacing:.04em;transform:rotate(-4deg)}
/* flash + wipe */
.flash{position:absolute;inset:0;background:#fff;opacity:0}
.wipe{position:absolute;top:0;bottom:0;left:0;width:1500px;background:linear-gradient(90deg,#8a0008,#e30613 18%,#e30613 100%);transform:translateX(-1500px);display:flex;align-items:center;justify-content:center}
.wipe span{position:absolute;left:640px;transform:translateX(-50%);font:700 150px/1 'Oswald';letter-spacing:.06em;white-space:nowrap;text-shadow:0 8px 0 rgba(0,0,0,.35)}
.wipe i{position:absolute;left:0;right:0;height:10px;background:#fff}
</style></head>
<body>
<div class="back" id="back">
  <div class="studio"></div><div class="rays"></div>
  <div class="moon"></div>
  <div class="sky" id="sky"></div>
  <div class="glass"></div>
  <div class="mullion" style="left:190px"></div><div class="mullion" style="left:520px"></div><div class="mullion" style="left:850px"></div><div class="mullion" style="left:1090px"></div>
  <div class="sign">CHAINTAIL NEWS</div>
</div>
<div class="front" id="front">
  <div class="desk"></div>
  <div class="qday" id="qday"><b>Q-DAY?</b><i>(fake)</i></div>
  <div id="otsw" style="position:absolute;inset:0"><div class="otstag" id="otstag">BANKLESS</div>
  <div class="ots" id="ots"><div class="pan" id="pan">
    <img src="assets/bankless-debate-thumb.jpg">
    <svg class="pen" id="penw" viewBox="0 0 410 230"><path id="pen" d="M0 0"/></svg></div></div></div>
  <div class="tweetw" id="tweetw" style="position:absolute;inset:0"><div class="tweet" id="tweet">
    <img class="thead" src="assets/tweet-header-v4.jpg">
    <div class="twin"><div class="tscroll" id="tscroll"><div class="tinner" id="tinner"><img src="assets/tweet-body.jpg"></div></div></div>
    <img class="tfoot" src="assets/tweet-footer.jpg">
  </div></div>
  <div class="l3" id="l3"><div class="tag" id="l3tag">BREAKING</div><div class="bar" id="l3bar">LIAM</div></div>
  <div class="l3sub" id="l3sub">Chaintail Labs, Senior Bunker Correspondent</div>
  <div class="chbug" id="chbug"><div class="live" id="live"><i class="dot" id="livedot"></i>LIVE</div><img src="assets/chaintail-logo-white.svg"><span>CNN</span></div>
  <div class="ticker"><div class="lbl">CT LIVE</div><div class="win"><div class="run" id="run"></div></div></div>
  <div class="flash" id="flash"></div>
  <div class="wipe" id="wipe"><i style="top:215px"></i><i style="top:495px"></i><span>SPECIAL REPORT</span></div>
</div>
<script src="data/tweet-hl.js"></script>
<script src="lib/film.js"></script>
<script>
const f = window.__film, L = new URLSearchParams(location.search).get('layer');
if (L) { document.documentElement.dataset.layer = L; document.body.classList.add('layer-' + L); }
const $ = (id) => document.getElementById(id);
const OFF = 0.08; // desk t0 = 8.16 s in Liam's recording; words below are transcript times minus 8.24, plus OFF

// ---- back: skyline (seeded) ----
{ const r = f.rng(42), sky = $('sky'); let x = -10;
  while (x < 1290) { const w = 40 + r() * 70, h = 60 + r() * 300 * (0.4 + 0.6 * Math.abs(Math.sin(x / 260)));
    const b = document.createElement('i'); b.style.cssText = `left:${x}px;width:${w}px;height:${h}px;opacity:${0.55 + r() * 0.45}`;
    for (let k = 0; k < (w * h) / 900; k++) { const s = document.createElement('b'); s.style.cssText = `left:${6 + r() * (w - 14)}px;top:${6 + r() * (h - 14)}px;opacity:${r() < .45 ? .8 : .12}`; b.append(s); }
    sky.append(b); x += w + 3 + r() * 14; } }

// ---- front: timeline ----
const A = (id, kf, at, dur, o) => f.anim($(id), kf, at, dur, o);
// entry flash from the BREAKING NEWS cut
A('flash', [{opacity:1},{opacity:0}], 0, 0.5, {easing:'ease-out'});
// LIVE dot pulse (loops via keyframes with iterations, still seekable)
A('livedot', [{opacity:1},{opacity:.25},{opacity:1}], 0, 1.2, {iterations:40});
// lower third in at 0.4, becomes the headline at "spiral" (6.8), stays
A('l3', [{transform:'translateX(-120%)'},{transform:'none'}], 0.4, 0.45, {easing:'cubic-bezier(.2,.9,.3,1)'});
A('l3sub', [{transform:'translateX(-120%)'},{transform:'none'}], 0.5, 0.45, {easing:'cubic-bezier(.2,.9,.3,1)'});
f.onSeek((t) => { // text swap is a hard cut on the frame, keyed on time; white box stays BREAKING, red bar carries the name
  const second = t >= 5.6 + OFF;
  $('l3tag').textContent = 'BREAKING';
  $('l3bar').textContent = second ? 'CRYPTO TWITTER IN SPIRAL' : 'LIAM';
  $('l3sub').textContent = second ? 'Ethereum researcher calls for “bunker mode”' : 'Chaintail Labs, Senior Bunker Correspondent';
});
A('chbug', [{opacity:0},{opacity:1}], 0.4, 0.4);
if (new URLSearchParams(location.search).get('live') === 'tl') { const l = $('live'); l.classList.add('tl'); $('front').append(l); }   // A/B: LIVE top-left instead of beside CNN
// over-the-shoulder box: in at "this lead Ethereum researcher" (0.96) with the FULL thumbnail (Anatoly and Justin), held for a beat
A('ots', [{opacity:0,transform:'translateY(-30px)'},{opacity:1,transform:'none'}], 0.9 + OFF, 0.35, {easing:'ease-out'});
A('otstag', [{opacity:0},{opacity:1}], 1.1 + OFF, 0.2);
// face geometry in 410x230 box coordinates (thumbnail face centre ~ (170,395)/1280 * 410)
const fx = 170 * 410 / 1280, fy = 395 * 410 / 1280, fr = 150 * 410 / 1280;
// hand-drawn circle: a seeded wobbly loop (1.12 turns, radius drifting, low-frequency wobble plus jitter), drawn with stroke-dashoffset
{ const r = f.rng(77), pts = []; const a0 = -1.9, turns = 1.12, N = 140;
  const ph = [r() * 6.28, r() * 6.28, r() * 6.28];
  for (let i = 0; i <= N; i++) { const u = i / N, a = a0 + u * turns * 6.2832;
    const rad = fr * (0.98 + 0.10 * u + 0.045 * Math.sin(2 * a + ph[0]) + 0.03 * Math.sin(3 * a + ph[1]) + 0.012 * Math.sin(9 * a + ph[2]));
    pts.push([fx + 1.05 * rad * Math.cos(a) + 1.5 * (u - .5), fy + 1.12 * rad * Math.sin(a)]); }
  $('pen').setAttribute('d', 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L')); }
const tc = 2.6 + OFF;   // the circle starts after the beat on the full thumbnail
const penLen = Math.ceil($('pen').getTotalLength()) + 2;
A('pen', [{strokeDasharray:`${penLen} ${penLen}`,strokeDashoffset:penLen},{strokeDasharray:`${penLen} ${penLen}`,strokeDashoffset:0}], tc, 1.9, {easing:'cubic-bezier(.45,.05,.5,.95)'});
A('penw', [{opacity:1},{opacity:1,offset:.81},{opacity:0}], tc, 3.2);   // finished circle (drawn by 4.5) holds ~0.7 s, fades out by 5.8, before the zoom at 5.9
// zoom: box becomes a square, image zooms until the face fills it, slow, starts after the circle has faded
const z0 = 5.9 + OFF, zd = 2.2, S = 2.45, sq = 260;
A('ots', [{width:'410px',height:'230px'},{width:sq + 'px',height:sq + 'px'}], z0, zd, {easing:'ease-in-out'});
A('pan', [{transform:'translate(0,0) scale(1)'},{transform:`translate(${(sq / 2 - 5) - S * fx}px,${(sq / 2 - 5) - S * fy}px) scale(${S})`}], z0, zd, {easing:'ease-in-out'});
// rev 4: the zoomed face stays up until the tweet discussion ends ("... hidden until you actually sign something", 28.9), then exits as before
A('otsw', [{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-40px)'}], 29.0 + OFF, 0.45, {easing:'ease-in'});
// tweet component slides up on the other side at "He said, get ready for bunker mode" (7.12)
const t1 = 7.12 + OFF;
A('tweet', [{opacity:0,transform:'translateY(260px)'},{opacity:1,transform:'none'}], t1, 0.5, {easing:'cubic-bezier(.2,.9,.3,1)'});
// body scroll: source-pixel offsets into assets/tweet-body.jpg (1290 px wide, scale .33178). Landmarks: line pitch 77 px.
//   0 = top (bunker mode, fresh addresses, never signed, hash) | 1610 = "IMO ... ECDSA breaks before qday"
const K = 0.33178, SC = (y) => `translateY(${-y * K}px)`;
const tS = (at) => at + OFF;
// (scroll keyframes are built on absolute scene time: [t, y] pairs)
{ const keys = [[0, 0], [9.84, 0], [10.7, 1610], [14.5, 1610], [15.4, 0]].map(([t, y]) => [tS(t), y]), T = 44.4;
  f.anim($('tscroll'), keys.map(([t, y], i) => ({transform:SC(y), offset: i ? Math.min(.9999, t / T) : 0, easing:'ease-in-out'})).concat([{transform:SC(0),offset:1}]), 0, T); }
// highlighter (rev 4): exact sentences, drawn line by line from the sentence's first word to its last (data/tweet-hl.js, word boxes of the real body pixels).
// Each segment sweeps left to right in proportion to its width; the finished sentence stays until the next one starts, then fades out.
const HL = window.TWEET_HL;
// [sentence, sweep start, sweep end] in Liam's transcript time
const plan = [['bunker', 7.9, 9.7], ['imo', 11.0, 14.0], ['fresh', 15.9, 18.1], ['never', 18.4, 20.4], ['hash', 23.4, 26.4]];
plan.forEach(([name, a, b], k) => {
  const segs = HL[name], tot = segs.reduce((n, g) => n + (g.x1 - g.x0), 0), grp = document.createElement('div'); grp.className = 'hlg'; $('tinner').append(grp);
  let t = a;
  for (const g of segs) { const d = document.createElement('div'); d.className = 'hl'; d.style.cssText += `;left:${g.x0}px;top:${g.y0}px;width:${g.x1 - g.x0}px;height:${g.y1 - g.y0}px`; grp.append(d);
    const dur = (b - a) * (g.x1 - g.x0) / tot; f.anim(d, [{transform:'scaleX(0)'},{transform:'scaleX(1)'}], tS(t), dur, {easing:'linear'}); t += dur; }
  const next = plan[k + 1]; if (next) f.anim(grp, [{opacity:1},{opacity:0}], tS(next[1]) - 0.05, 0.25);
});
// the Q-DAY joke: at "maybe it never will be" (40.72) the over-the-shoulder box comes back top right with a card
A('qday', [{opacity:0,transform:'translateY(-40px)'},{opacity:1,transform:'none'}], 40.72 + OFF, 0.35, {easing:'cubic-bezier(.2,.9,.3,1)'});
A('tweetw', [{opacity:1,transform:'none'},{opacity:0,transform:'translateY(260px)'}], 38.3 + OFF, 0.45, {easing:'ease-in'});
// chyron
const jokes = ['@sol_maxi_…: it’s over', '@quant_…: quantum is 30 years away, buy the dip', '@eth_bro_…: told you hashes were the future', '@gm_fren_…: moving everything to a fresh address, brb', '@cold_wallet_…: my mattress is post-quantum', '@degen_dad_…: bunker mode = my basement', '@pubkey_…: never signing anything again', '@gold_bug_…: sold it all for gold, now what', '@lamport_…: have you tried not being on chain', '@vc_…: we are very bullish on bunkers', '@sha_…: finally, my time'];
const run = $('run'); const unit = document.createElement('span'); unit.innerHTML = jokes.map((j) => j.replace(/&/g, '&amp;')).join('<b>•</b>') + '<b>•</b>';
run.append(unit, unit.cloneNode(true));
let unitW = 0;
f.onSeek((t) => { if (!unitW) unitW = unit.getBoundingClientRect().width || 0; if (unitW) run.style.transform = `translateX(${-((t * 150) % unitW)}px)`; });
// exit: SPECIAL REPORT wipe, fully covering at 44.4
A('wipe', [{transform:'translateX(-1500px)'},{transform:'translateX(-220px)',offset:.55,easing:'linear'},{transform:'translateX(0)'}], 42.7, 1.7, {easing:'cubic-bezier(.5,0,.2,1)'});
</script></body></html>
