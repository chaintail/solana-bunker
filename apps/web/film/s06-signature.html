<script>
const f = window.__film, $ = (id) => document.getElementById(id), D = window.S06;
const P = (t, a, b) => f.prog(t, a, b), ease = (p) => p * p * (3 - 2 * p), lerp = (a, b, p) => a + (b - a) * p;
const step = (p, n) => Math.floor(p * n + 1e-6) / n;   // stop-frame motion: n discrete positions, no tween
const show = (el, on) => { el.style.display = on ? '' : 'none'; };

// ---------- slide 5 handoff: where the lab coat stands on the whiteboard in slide 5's last frame (neck point, scale). Change here when slide 5 exists.
const S5_HANDOFF = null;   // v7: no handoff move or zoom; he keeps the scene 5 end size and spot until the whiteboard is swept away
// slide 5 v5's last frame: the lab coat's shrug (s05-hash.html LAB_HOME pivot 175,533 scale .34; chin point = pivot + (0, (308-1000)*.34)). He stands there (baked in assets/s06/s05-end-full.png)
// until the first word at 0.3 s, then the live figure takes over. v9: its body is placed with slide 5's geometry (s05 professor-point = body x + 115.5 on the
// shrug frame, body px X -> 175 + (X - 396) * .34, Y -> 533 + (Y - 1000) * .34), so collar, tie and shoes do not move at the takeover (only the arms change);
// the s06 head sprite sits 6.49 px right / 2.68 px up of the s05 one for the same chin point (measured), so this figure's head is offset by that in body px.
// v10: slide 5 v8's last frame has the full-chin c22 cut (s05-heads.py NORM), so this figure's head is that cut and geometry, not the s06 sheet (see below).
const S5_END = { x: 175 + (394.5 - 396) * 0.34, y: 533 + (306 - 1000) * 0.34, s: 0.34, t0: 0.3, t1: 0.9 };
const ADDR = 'ADLw7WkPsqngneGqoCKmGR17w16kmgA9q1WnxURt9Wod';   // vaults[].recipient_sol, artifacts/public-deployment.json
const ADDR_SHORT = ADDR.slice(0, 6) + '…' + ADDR.slice(-8);

// ---------- line timing (data/s06-edl.js) -> scene times of the beats
const L = Object.fromEntries(D.edl.map((e) => [e.id, e]));
const at = (id, src) => L[id].out_in + (src - L[id].src_in);     // a word's take time -> scene time
const T = {
  sweep0: L.L1b.out_in, sweep1: L.L1b.out_in + 0.70,
  narrIn: L.L2.out_in - 0.15, problem: at('L2', 340.40), secret: at('L2', 342.48), pw: at('L2', 343.28), l2end: L.L2.out_out,
  whoever: L.L3.out_in, pw3: at('L3', 344.56), getsIn: at('L3', 345.44), l4: L.L4.out_in, nothing: at('L4', 347.28), where: at('L4', 348.32),
  getInFirst: at('L5', 351.76), first: at('L5', 352.72), l5end: L.L5.out_out, l6: L.L6.out_in, sig: at('L6', 354.64),
  withdrawal: at('L7a', 356.56), address: at('L7a', 358.14), l7aEnd: L.L7a.out_out, l7b: L.L7b.out_in, slam: D.markers.find((m) => m.id === 'SFX_SLOT_SLAM').t,
};
// v3 tag timing: sign right after "address", form through the slot, door opens for the stick man and shuts, a speech pause on the shut door,
// then the devil's attempt under "and nothing else", the slot slams on "else" (SFX_SLOT_SLAM in data/s06-edl.js), REJECTED, long hold
// v10 (Liam, 2026-10-16: "speed up the animation and cut out that pause"): L7b now follows L7a after a breath (s06-timing.py), so the gap's choreography,
// kept in its v9 seconds below, plays GK times faster: sign -> form through the slot -> door opens, stick man hops in, narrator out, door shuts (v9 sign0 .. 25.10),
// then the devil's rise (v9 25.90 .. 26.10); v9's 0.80 s hold on the shut door (25.10 .. 25.90) is dropped. g() maps v9 seconds from sign0 (unchanged, 0.80 s
// after "address") so the rise ends 0.05 s before "and", as in v9. Every duration inside the gap is divided by GK in the cues below.
const V9G = { shut: 25.10, rise: 25.90, riseD: 0.20 }, G0 = T.address + .80;
const GK = (V9G.shut - G0 + V9G.riseD) / (T.l7b - .05 - G0);
const g = (x) => G0 + (x - G0 - (x >= V9G.rise ? V9G.rise - V9G.shut : 0)) / GK;
Object.assign(T, { sign0: G0, sign1: g(G0 + 1.0), slot0: g(23.50), shrink0: g(23.60), squash0: g(24.00), slotShut: g(24.22),
  door0: g(24.45), hopIn: g(24.65), doorClose: g(24.95), narrOut: g(24.80), devilUp: g(V9G.rise), hand0: T.l7b + .10, hand1: T.l7b + .45, dslot0: T.l7b + .20 });
window.__GK = GK;
Object.assign(T, { stamp: T.slam + .35 }); T.freeze = T.stamp + .20;
const FREEZE_AT = T.freeze;          // everything stops here (grain keeps running)
window.__T = T;

// ---------- characters: body PNG minus its grey oval + head + the same PNG below the collar line in front of the neck
const BODY = {
  suitX: { src: 'assets/bodies/1-suit-arms-crossed.png', ox: 511, chin: 306 },
  suitP: { src: 'assets/bodies/1-suit-point-right.png', ox: 352, chin: 309 },
  prof: { src: 'assets/bodies/5-physicist-professor-point.png', ox: 394.5, chin: 306 },

const HK = 0.326;                  // key px -> body px (chin to collar line; see film-plan-s06.md section 3)
function makeFig(parent, bodyKey, headKind) {
  const b = BODY[bodyKey], el = document.createElement('div'); el.className = 'fig';

  fm.style.transform = `translate(${fx}px,${fy}px) rotate(${frot}deg) scale(${fs},${fs * fsy})`;
  const type = (s, t1, cps = 25) => s.slice(0, Math.max(0, Math.floor((t - t1) * cps + 1e-6)));
  $('fAmt').textContent = type('1.5 SOL', T.withdrawal);
  $('fTo').textContent = type(ADDR_SHORT, T.address, 22); $('fToFull').textContent = t >= T.address + .7 ? ADDR : '';
  if (!sigLen) sigLen = sigEl.getTotalLength();
  const sp = P(t, T.sign0, T.sign1); sigEl.style.strokeDashoffset = (1 - sp).toFixed(4);
  const q = $('quill'); show(q, t >= T.sign0 - .3 && t < T.sign1 + .3 / GK);
  const pt = sigEl.getPointAtLength(sigLen * sp); q.style.transform = `translate(${pt.x - 3}px,${pt.y - 138}px)`;

  // REJECTED: slams in after the slot (dossier.js D.slam curve: scale 3 -> .96 -> 1 in 0.14 s, -8 deg), with a camera thump on the world
  show($('stampL'), t0 >= T.stamp);
  if (t0 >= T.stamp) { const p = P(t0, T.stamp, T.stamp + .14), sc = p < .8 ? lerp(3, .96, Math.pow(p / .8, 2)) : lerp(.96, 1, (p - .8) / .2);
    $('stampIn').style.transform = `rotate(-8deg) scale(${sc.toFixed(4)})`; $('stampIn').style.opacity = Math.min(1, p / .8).toFixed(3); }
  { const d = t0 - T.stamp - .14; const y = d >= 0 && d < .45 ? 9 * Math.exp(-d * 9) * Math.sin(d * 52) : 0;
    $('world').style.transform += ` translateY(${y.toFixed(2)}px)`; }
  // rain (stops in the freezes)
  rain(t);
});
