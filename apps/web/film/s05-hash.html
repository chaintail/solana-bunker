cue(0, END, (u, t) => { const y = tweetScroll(t); $('tscroll').style.transform = `translateY(${-y * K}px)`; hlEls.forEach((h, i) => { const a = HT[i], v = clamp((t - a) / 0.18); h.style.opacity = t < a ? 0 : (t > T.s4Out[0] ? 1 : 1); h.style.transform = `scaleX(${eo(v)})`; }); });

});
// ---- beat 2: the hash vault on the board
cue(T.title, T.title + 0.9, (u) => { wipe(titleEl, u); }); cue(T.title + 0.5, T.title + 1.0, (u) => stroke(titleUl, u));
cue(T.man, T.man + 0.7, (u) => { manParts.forEach((p, i) => stroke(p, clamp(u * 2 - i * .8))); wipe(manTxt, clamp(u * 3 - 1.7)); });
cue(T.prog, T.prog + 0.8, (u) => { stroke(progRect, u); wipe(progTitle, clamp(u * 2 - 0.8)); });
cue(T.qr, T.qr + 0.35, (u) => { QB1.style.opacity = u > 0 ? 1 : 0; QB1.style.transform = `scale(${lerp(1.5, 1, back(u))})`; });
cue(T.qr + 0.3, T.qr + 0.65, (u) => { QB2.style.opacity = u > 0 ? 1 : 0; QB2.style.transform = `scale(${lerp(1.5, 1, back(u))})`; });
listEls.forEach((e, i) => cue(T.list + i * 0.1, T.list + i * 0.1 + 0.25, (u) => wipe(e, u)));
cue(T.math, T.math + 0.4, (u) => { const m = $('math'); m.style.opacity = u > 0 ? 1 : 0; m.style.transform = `translateY(${(1 - eo(u)) * -50}px)`; });
cue(T.cascEnd - 0.1, T.cascEnd + 0.4, (u) => { if (u <= 0) return; listEls.forEach((e) => (e.style.opacity = lerp(1, .32, u))); });
// spend
const spendT = E.c7a.speech[0];
cue(spendT - 0.05, spendT + 0.3, (u) => { listHL.style.top = (LY[2] - 17) + 'px'; listHL.style.opacity = u > 0 ? 1 : 0; });
cue(spendT, spendT + 0.8, (u) => { const [x, y] = bez([100, LY[2] - 15], [60, 170], [95, 150], eo(u)); chip.style.opacity = u > 0 ? 1 : 0; pos(chip, x, y); });
cue(spendT + 0.8, spendT + 1.5, (u) => { if (u <= 0) return; const [x, y] = bez([95, 150], [250, 60], [440, 160], eio(u)); pos(chip, x, y); if (u > 0) chip.style.opacity = u >= 1 ? 0 : 1; });
cue(E.c7b.speech[0] - 0.2, E.c7b.speech[0] + 0.1, (u) => { if (u > 0) listHL.style.opacity = 1 - u; });

const coinT = E.c8.speech[0] + 0.7;
cue(T.swarm - 0.1, T.swarm + 0.2, (u) => { if (u <= 0) return; xMark.style.opacity = 1 - u; });
cue(coinT, coinT + 1.1, (u) => { const x = lerp(452, 100, eio(u)), y = lerp(166, 150, u) - 90 * Math.abs(Math.sin(u * 3.1416 * 2)) * (1 - u * .4); coin.style.opacity = u > 0 ? 1 : 0; pos(coin, x - 27, y - 27, `rotate(${u * 540}deg)`); });
// shrug / annoying: sweat drops on the user while he keeps track of a thousand passwords
cue(E.c10.speech[0], E.c10.speech[1], (u, t) => { sweat.forEach((d, i) => { const v = (u * 3 + i * .33) % 1; d.style.left = (52 + i * 36) + 'px'; d.style.top = (60 + v * 120 - 40) + 'px'; d.style.opacity = u > 0 && u < 1 ? (1 - v) : 0; }); listEls.forEach((e, i) => { const k = clamp(u * 12 - i); e.style.color = k > 0 && k < 1 ? '#d02323' : '#1d2230'; }); });
// rent tag
cue(T.tag, T.tag + 1.3, (u) => { const a = u < 1 ? -105 * Math.exp(-3.2 * u) * Math.cos(9 * u) : 0; tag.style.opacity = u > 0 ? 1 : 0; tag.style.transform = `rotate(${a}deg)`; });
cue(E.c11.out_out + 0.5, E.c11.out_out + 1.0, (u) => { const w = $('tsol'); w.style.transform = `translateY(${(1 - back(u)) * 60}px)`; w.style.filter = `blur(${(1 - u) * 3}px)`; w.style.opacity = u > 0 ? 1 : 0; });
cue(E.c11.out_out + 1.45, E.c11.out_out + 1.6, (u) => { const r = $('rent'); r.style.opacity = u > 0 ? .9 : 0; r.style.transform = `rotate(-10deg) scale(${lerp(2.6, 1, eo(u))})`; });
// ---- beat 3: version two
cue(T.strike, T.strike + 0.25, (u) => stroke(strike001, u));
cue(T.two, T.two + 0.15, (u) => { const s = $('s002'); s.style.opacity = u > 0 ? .92 : 0; s.style.transform = `rotate(-8deg) scale(${lerp(2.4, 1, eo(u))})`; });
cue(T.two + 0.1, T.two + 0.3, (u) => { if (u <= 0) return; $('qc').innerHTML = qrSvg(u > 0.5 ? window.QR.code2 : window.QR.code1, 112); $('qcap1').textContent = u > 0.5 ? 'lib.rs · line 114' : 'lib.rs · line 113'; $('qp').innerHTML = qrSvg(u > 0.5 ? window.QR.proof2 : window.QR.proof1, 112); $('qcap2').textContent = u > 0.5 ? 'devnet tx 5XPHXjBK…' : 'devnet tx 5mHxtbGL…'; QB1.style.transform = QB2.style.transform = `scaleX(${Math.abs(Math.cos(u * 3.1416))})`; });
cue(T.tree - 0.1, T.tree + 0.5, (u) => { wipe(leavesTxt, clamp(u * 2 - .6)); });
cue(T.root - 0.1, T.root + 0.6, (u) => { wipe(rootTxt, u); });
// dim everything but the program box while the tree builds
cue(T.root - 0.5, T.root + 0.2, (u) => { if (u <= 0) return; const o = lerp(1, .3, u); listEls.forEach((e) => (e.style.opacity = Math.min(parseFloat(e.style.opacity || 1), o))); manParts.forEach((p) => (p.style.opacity = o)); manTxt.style.opacity = o; $('rent').style.opacity = lerp(.9, .22, u); $('math').style.opacity = lerp(1, .35, u); titleEl.style.opacity = lerp(1, .45, u); });
// odometer: 33,126 -> 390, then 0.234 SOL slashed, 0.0066 SOL written in
cue(T.odo, T.odoEnd, (u) => { const n = Math.round(lerp(33126, 390, eo(u))); $('tbig').textContent = (n >= 1000 ? n.toLocaleString('en-US') : String(n)); $('tbig').style.transform = `translateY(${u > 0 && u < 1 ? Math.sin(u * 150) * 2.5 : 0}px)`; if (u >= 1) $('tbig').style.color = '#128a3e'; else $('tbig').style.color = '#1d2230'; });
cue(T.odoEnd + 0.1, T.odoEnd + 0.4, (u) => { $('tstrike').style.transform = `scaleX(${u})`; });
cue(T.odoEnd + 0.5, T.odoEnd + 1.2, (u) => wipe(slashed, u));
// celebration: Joe pops up from the bottom, the engineer walks in from the right, both freeze; confetti is drawn per frame
cue(T.joe, T.joe + 0.5, (u) => { FJ.rise = u; });
cue(T.eng, T.eng + 1.0, (u) => { FE.walk = u; });
const exitT = E.c16a.speech[0] - 0.05;
cue(exitT, exitT + 0.45, (u) => { FJ.exit = u; FE.exit = u; });
// ---- beat 4: the robbery (board clock)
const R0 = T.race;
cue(T.mail, T.mail + 0.4, (u) => { const m = mailbox; m.style.opacity = u > 0 ? 1 : 0; m.style.transform = `scale(${lerp(.3, 1, back(u))})`; });
const PATH_A = [[110, 150], [180, 330], [255, 520]];       // user -> mailbox
cue(R0 + 0.1, R0 + 2.2, (u) => { const [x, y] = bez([96, 140], [150, 300], [250, 500], u); envA.style.opacity = u > 0 ? 1 : 0; pos(envA, x - 56, y - 40, `rotate(${Math.sin(u * 40) * 7}deg)`); });
cue(R0 + 2.2, R0 + 2.7, (u) => { if (u <= 0) return; const [x, y] = [250 + 0 * u, 500]; pos(envA, x - 56, y - 40 - 8 * Math.sin(u * 3.14) , `scale(${1 - .0 * u})`); });
cue(R0 + 2.7, R0 + 6.2, (u) => { if (u <= 0) return; const x = lerp(250, 372, u), y = lerp(500, 540, u); pos(envA, x - 56, y - 40, `rotate(${Math.sin(u * 60) * 6}deg)`); });
cue(R0 + 1.2, R0 + 1.75, (u) => { FB.pop = eo(u); });
// red envelope: from the bandit up over the board in a big arc, through MATH, into the program
const RP = [[820, 640], [940, 150], [560, 20], [300, 160], [286, 340], [370, 470], [470, 470]];
cue(R0 + 2.4, R0 + 4.65, (u) => {
  const e = eio(u); const seg = e * (RP.length - 1), i = Math.min(RP.length - 2, Math.floor(seg)), v = seg - i;
  const p = RP, a = p[i], b = p[i + 1], c0 = p[Math.max(0, i - 1)], d = p[Math.min(p.length - 1, i + 2)];
  const cr = (a1, b1, c1, d1, s) => 0.5 * ((2 * b1) + (-a1 + c1) * s + (2 * a1 - 5 * b1 + 4 * c1 - d1) * s * s + (-a1 + 3 * b1 - 3 * c1 + d1) * s * s * s);
  const x = cr(c0[0], a[0], b[0], d[0], v), y = cr(c0[1], a[1], b[1], d[1], v);
  envR.style.opacity = u > 0 && u < 1 ? 1 : 0; pos(envR, x - 56, y - 40, `rotate(${Math.sin(u * 8) * 14}deg) scale(${1 + .25 * Math.sin(u * 3.14)})`); });
cue(R0 + 4.7, R0 + 5.0, (u) => stroke(leafX, u));
// LED card
cue(R0 + 4.8, R0 + 5.3, (u) => { card4.style.opacity = u; });
// ---- freeze: "oh crap"
const F0 = T.freeze;
cue(F0, F0 + 0.3, (u) => { FX.gray = u; });
cue(F0 + 0.25, F0 + 0.8, (u) => { const e = polaroid; e.style.opacity = u > 0 ? 1 : 0; e.style.transform = `translateY(${(1 - back(u)) * -620}px) rotate(${lerp(-12, 4, eo(u))}deg)`; });
cue(E.c18.speech[0] - 0.35, E.c18.speech[0] - 0.05, (u) => { if (u <= 0) return; polaroid.style.transform = `translateY(${eo(u) * -700}px) rotate(4deg)`; if (u >= 1) polaroid.style.opacity = 0; });
const th0 = WS('c18', 3) - 0.05;
cue(th0, th0 + 0.3, (u) => { theo.style.opacity = u > 0 ? 1 : 0; theo.style.transform = `scale(${lerp(1.5, 1, eo(u))})`; theoUl.style.opacity = u >= 0.6 ? 1 : 0; });
cue(E.c19.speech[0] - 0.3, E.c19.speech[0] + 0.05, (u) => { if (u <= 0) return; theo.style.opacity = 1 - u; theoUl.style.opacity = 1 - u; });
const sw0 = WS('c19', 11) - 0.1;
cue(sw0, sw0 + 0.3, (u) => { swC.style.opacity = u > 0 ? 1 : 0; swC.style.transform = `scale(${lerp(.4, 1, back(u))})`; });
cue(sw0 + 0.2, sw0 + 1.0, (u) => { const ms = Math.round(eo(u) * 400); $('swTxt').textContent = ms + ' ms'; $('swHand').setAttribute('transform', `rotate(${eo(u) * 360 * 1.0} 120 170)`); });
cue(E.c19.out_out + 0.1, E.c19.out_out + 0.4, (u) => { if (u > 0) swC.style.opacity = 1 - u; });
const ey0 = WS('c20a', 5) - 0.1;
cue(ey0, ey0 + 0.35, (u) => { eyeC.style.opacity = u > 0 ? 1 : 0; eyeC.style.transform = `scale(${lerp(.6, 1, back(u))})`; });
cue(E.c20a.out_out + 0.0, E.c20a.out_out + 0.3, (u) => { if (u > 0) eyeC.style.opacity = 1 - u; });
const ed0 = WS('c20b', 2) - 0.05;
cue(ed0, ed0 + 0.4, (u) => { edC.style.opacity = u > 0 ? 1 : 0; edC.style.transform = `scale(${lerp(.7, 1, back(u))})`; $('edCrack').style.opacity = u > 0.9 ? 1 : 0; });
const ft0 = WE('c20b', 5) - 0.7;
cue(ft0, ft0 + 0.3, (u) => { foot.style.opacity = u > 0 ? 1 : 0; foot.style.transform = `rotate(-2deg) scale(${lerp(1.4, 1, eo(u))})`; });
cue(E.c20b.out_out + 0.1, E.c20b.out_out + 0.45, (u) => { if (u > 0) { edC.style.opacity = 1 - u; foot.style.opacity = 1 - u; } });
const st0 = WS('c20c', 2) - 0.05;
cue(st0 - 0.1, st0 + 0.3, (u) => { stepsC.style.opacity = u > 0 ? 1 : 0; });
[WS('c20c', 2), WS('c20c', 5), WS('c20c', 9)].forEach((a, i) => cue(a - 0.1, a + 0.3, (u) => { stepNodes[i].style.opacity = u > 0 ? 1 : 0; stepNodes[i].style.transform = `translateY(${(1 - eo(u)) * 30}px)`; }));
cue(WS('c20c', 13) - 0.1, WS('c20c', 13) + 0.3, (u) => { beatsTxt.style.opacity = u > 0 ? 1 : 0; beatsTxt.style.transform = `scale(${lerp(1.5, 1, eo(u))})`; });
cue(E.c20c.out_out + 0.1, E.c20c.out_out + 0.4, (u) => { if (u > 0) stepsC.style.opacity = 1 - u; });
const ta0 = WS('c21', 2) - 0.05;
cue(ta0, ta0 + 0.18, (u) => { timing.style.opacity = u > 0 ? .95 : 0; timing.style.transform = `rotate(-6deg) scale(${lerp(3, 1, eo(u))})`; });
cue(E.c22.speech[0] - 0.4, E.c22.speech[0] - 0.05, (u) => { if (u > 0) timing.style.opacity = .95 * (1 - u); });
const ck0 = WS('c22', 3);
cue(ck0, ck0 + 0.6, (u) => stroke(tick, u));
cue(ck0 + 0.5, ck0 + 0.9, (u) => wipe(shrugTxt, u));
cue(ck0 - 0.3, ck0 + 0.4, (u) => { if (u <= 0) return; FX.gray = 1 - u; });
cue(ck0 - 0.1, ck0 + 0.5, (u) => { if (u <= 0) return; $('bcv').style.opacity = lerp(1, .16, u); });
cue(ck0, END, (u, t) => { if (u <= 0) return; progRect.style.stroke = '#128a3e'; progRect.style.strokeWidth = 8; });   // program box outline turns green with the check

// misc state objects set by the cues above
const FB = { pop: 0 }, FX = { flash: 0, gray: 0 };
FJ.rise = 0; FJ.exit = 0; FE.walk = 0; FE.exit = 0;
// confetti / bandit frame
const bandFrame = () => headIdx(E.c19.out_in + 2.4);
const polaFrame = () => headIdx(WS('c16b', 4) + 0.1);

// ======================= render =======================
f.onSeek((t) => {
  const tb = TB(t);
  // reset the transient cue values then run every cue in order (each cue clamps to its own [a, b], so the end state persists)
  for (const c of cues) { const clk = c.a < T.freeze ? tb : t; const u = clamp((clk - c.a) / (c.b - c.a)); c.fn(u, clk); }
  drawCanvas(tb); drawConf(t);
  // lab coat
  const ls = labState(t); setPose(FL, ls.pose); setHead(FL.hd, headIdx(t)); place(FL, ls);
  // Joe / engineer (frozen heads: a sprite frame while he talks about 'celebrate' / 'bunker')
  setPose(FJ, 'celebrate'); setHead(FJ.hd, headIdx(WS('c15', 5) + 0.05));
  { const rise = eo(FJ.rise), ex = eio(FJ.exit); place(FJ, { x: JOE.x + 0 * rise, y: lerp(JOE.y + 560, JOE.y, rise) + ex * 640, r: 0, s: JOE.s, flip: 1, vis: FJ.rise > 0 && FJ.exit < 1 }); }
  setPose(FE, 'thumbs'); setHead(FE.hd, headIdx(WS('c15', 9) + 0.05));
  { const w = eio(FE.walk), ex = eio(FE.exit), hop = FE.walk > 0 && FE.walk < 1 ? Math.abs(Math.sin(FE.walk * 3.1416 * 5)) * 26 : 0, lean = FE.walk > 0 && FE.walk < 1 ? Math.sin(FE.walk * 3.1416 * 5) * 5 : 0;
    place(FE, { x: lerp(1480, ENG.x, w) + ex * 460, y: ENG.y - hop, r: lean, s: ENG.s, flip: 1, vis: FE.walk > 0 && FE.exit < 1 }); }
  // bandit head
  { const b = $('bandit'); const p = eo(FB.pop); b.style.opacity = FB.pop > 0 ? 1 : 0; b.style.transformOrigin = '0 0'; b.style.transform = `translate(${823}px,${lerp(790, 566, p)}px) rotate(${-4 + Math.sin(t * 5) * 1.5}deg) scale(.82)`; }
  // polaroid photo
  { const h = $('phd'); setHead(h, polaFrame()); h.style.transform = 'scale(1.78)'; h.style.left = '8px'; h.style.top = '-8px'; }
  // desaturate the world at the freeze (+ a white flash when the red envelope dives in)
  $('scene').style.filter = FX.gray > 0 ? `grayscale(${FX.gray}) contrast(${1 + .1 * FX.gray})` : 'none';
});
