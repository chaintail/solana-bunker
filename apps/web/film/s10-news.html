     ?layer=back  the studio backdrop (identical to the opening's; one still)
     ?layer=front desk, bug, lower third, OTS box, chyron, SPECIAL REPORT wipe, beaker bug (transparent PNGs)

   The CSS below is s02-news.html's, copied; the additions for scene 10 are at the end. */

     ?layer=back  studio backdrop (static; one still is enough)

.beaker svg{width:58px;height:66px;overflow:visible}
</style></head>

<script>
const f = window.__film, L = new URLSearchParams(location.search).get('layer'), T = window.S10.T;
if (L) { document.documentElement.dataset.layer = L; document.body.classList.add('layer-' + L); }
const $ = (id) => document.getElementById(id), P = (t, a, b) => f.prog(t, a, b), lerp = (a, b, p) => a + (b - a) * p;
const easeO = (p) => 1 - Math.pow(1 - p, 3), easeIO = (p) => (p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
const backO = (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
// ---- back: skyline (seeded) ----
{ const r = f.rng(42), sky = $('sky'); let x = -10;
  while (x < 1290) { const w = 40 + r() * 70, h = 60 + r() * 300 * (0.4 + 0.6 * Math.abs(Math.sin(x / 260)));
    const b = document.createElement('i'); b.style.cssText = `left:${x}px;width:${w}px;height:${h}px;opacity:${0.55 + r() * 0.45}`;
    for (let k = 0; k < (w * h) / 900; k++) { const s = document.createElement('b'); s.style.cssText = `left:${6 + r() * (w - 14)}px;top:${6 + r() * (h - 14)}px;opacity:${r() < .45 ? .8 : .12}`; b.append(s); }
    sky.append(b); x += w + 3 + r() * 14; } }


// ---- chyron: the opening's ticker, scene 10's jokes (data/s10-chyron.js), 150 px/s
const run = $('run'), unit = document.createElement('span');
unit.innerHTML = window.S10_CHYRON.map((j) => j.replace(/&/g, '&amp;')).join('<b>•</b>') + '<b>•</b>'; run.append(unit, unit.cloneNode(true));
let unitW = 0;
// ---- the whitepaper code (5 px a module, 4-module quiet zone)
{ const q = window.S10_QR.paper, s = (q.n + 8) * 5; $('wpq').innerHTML = `<svg viewBox="-4 -4 ${q.n + 8} ${q.n + 8}" width="${s}" height="${s}" shape-rendering="crispEdges"><rect x="-4" y="-4" width="${q.n + 8}" height="${q.n + 8}" fill="#fff"/><path d="${q.d}" fill="#000"/></svg>`; }
// ---- the nested vault (scene 4's drafting function, lib/vault.js): outer level 2, inner level 2 at 0.42 R inside the hub
const OUT = window.vaultDraw($('vsv'), 205, 115, 92, 2), INN = window.vaultDraw($('vsv'), 205, 115, 92 * .42, 2, '#ffd23f');   // the inner door in scene 4's accent yellow
const vaultParts = (v) => [...v.rings, ...v.spokes, ...v.hinges, ...v.extra];
// ---- lower third states (v6, Liam): the bar is on screen from the studio's first frame, UPDATE over an empty red box until CRYPTO NERD pops in.
// Every switch: the changed texts fade out (150 ms), the white tag box and the red box resize to the next state's widths (250 ms, eased), the new texts fade in (150 ms),
// centred on the switch time. Where the tag text stays (COMING UP NEXT titles: the red box keeps its width) the texts only cross out and in (150 ms each).
const CUN = Math.ceil(T.cut * 30 - 1e-6) / 30;   // v7 (Liam): COMING UP NEXT switches on the jump cut's frame (401), its resize centred there, to hide the cut with graphics motion

const SUB_LIAM = 'Liam C.  ·  Bunker Correspondent, Chaintail Labs', SUB_NEXT = 'Next on Chaintail News', POP = T.crypto - .25;
const CRYPTO = '<span class="w">CRYPTO</span><span class="ins" id="ins"><i id="insi">GRAPHY</i></span><span class="w"> NERD</span>';
function typed(t) { const s1 = '7,856-byte signatures', s2 = ', no state to track', n1 = Math.round(s1.length * P(t, T.bigger, T.bigger + .45)), n2 = Math.round(s2.length * P(t, T.never, T.never + .45));
  return s1.slice(0, n1) + s2.slice(0, n2) || SUB_NEXT; }
function l3state(t) {
  if (t < CUN) return { tag: 'UPDATE', bar: t >= POP ? CRYPTO : '', sub: SUB_LIAM };
  if (t < T.slh) return { tag: 'COMING UP NEXT', bar: '<span class="w">A STATELESS BUNKER</span>', sub: typed(t) };
  if (t < T.and_fav) return { tag: 'COMING UP NEXT', bar: '<span class="w">SLH-DSA (FIPS 205)</span>', sub: typed(t) };
  return { tag: 'COMING UP NEXT', bar: '<span class="w">BUNKER IN A BUNKER</span>', sub: SUB_NEXT };      // v5: from "And my personal favorite idea" to the end
}
function tagW(s) { const m = $('l3tag'), w0 = m.style.width, h0 = m.innerHTML; m.style.width = 'auto'; m.innerHTML = `<span>${s}</span>`;
  const w = m.getBoundingClientRect().width; m.style.width = w0; m.innerHTML = h0; return w; }
function l3(t) {
  const st = l3state(t); let w = tagW(st.tag), op = { tag: 1, bar: 1, sub: 1 };
  for (const ts of [CUN, T.slh, T.and_fav]) {
    if (Math.abs(t - ts) > .3) continue;
    const a = l3state(ts - .3), b = l3state(ts + .3), rs = a.tag !== b.tag;
    const [t0, t1, t2, t3] = rs ? [ts - .275, ts - .125, ts + .125, ts + .275] : [ts - .15, ts, ts, ts + .15];
    const o = t < ts ? 1 - P(t, t0, t1) : P(t, t2, t3);
    for (const k of ['tag', 'bar', 'sub']) if (a[k] !== b[k]) op[k] = o;
    if (rs) w = lerp(tagW(a.tag), tagW(b.tag), easeIO(P(t, t1, t2)));
  }
  $('l3tag').style.width = w + 'px'; $('l3tag').innerHTML = `<span style="opacity:${op.tag}">${st.tag}</span>`;
  $('l3bar').innerHTML = `<span class="bt" id="bt" style="opacity:${op.bar}">${st.bar}</span>`;
  $('l3sub').innerHTML = `<span style="opacity:${op.sub}">${st.sub}</span>`;
  if (st.bar === CRYPTO) {
    // CRYPTO NERD pops in (0.2 s, as he says "crypto"); then NERD slides to the right and GRAPHY fades in between (yellow)
    const pp = P(t, POP, POP + .2), sc = pp < .6 ? lerp(.7, 1.06, easeO(pp / .6)) : lerp(1.06, 1, (pp - .6) / .4);
    $('bt').style.transform = `scale(${sc})`; $('bt').style.opacity = String(op.bar * Math.min(1, pp * 2.5));
    const slide = easeIO(P(t, T.graphy, T.graphy + .25)), fade = P(t, T.graphy + .12, T.graphy_end), i = $('insi');
    $('ins').style.width = (i.getBoundingClientRect().width * slide) + 'px'; i.style.opacity = String(fade);
  }
}
f.onSeek((t) => {
  // the wipe: in over scene 9's last frame (0-0.55), full cover with WE NOW RETURN TO THE STUDIO typing (0.55-1.10), back out to the left (1.10-2.00)
  const wi = easeIO(P(t, T.wipe_in, T.cover)), wo = easeIO(P(t, T.out_start, T.out_end));
  $('wipe').style.transform = `translateX(${t < T.out_start ? lerp(-1500, 0, wi) : lerp(0, -1500, wo)}px)`;
  const msg = 'WE NOW RETURN TO THE STUDIO'; $('ret').textContent = msg.slice(0, Math.round(msg.length * P(t, T.cover + .05, T.cover + .45)));
  $('desk1').style.visibility = t >= T.cover ? 'visible' : 'hidden';           // under the full cover the desk replaces scene 9
  $('flash').style.opacity = String(t >= T.out_start ? .55 * (1 - P(t, T.out_start, T.out_start + .3)) : 0);   // the wipe's flash only (v7: no flash at the jump cut)
  $('livedot').style.opacity = String(.25 + .75 * Math.abs(Math.cos(t * Math.PI / 1.2)));
  if (!unitW) unitW = unit.getBoundingClientRect().width || 0; if (unitW) run.style.transform = `translateX(${-((t * 150) % unitW)}px)`;
  // lower third: on screen from the studio's first frame (v6), under the wipe until it moves out
  $('l3').style.visibility = $('l3sub').style.visibility = t >= T.cover ? 'visible' : 'hidden';
  $('chbug').style.opacity = String(P(t, T.l3_in, T.l3_in + .4));
  l3(t);
  // OTS box (v8, Liam): appears once at the whitepaper beat and never leaves (through the jump cut and the last frame). At the bunker-in-a-bunker beat its CONTENT
  // crossfades in place (0.2 s, box position and size unchanged) from the whitepaper to the nested vault.
  const inA = P(t, T.white, T.white + .35), k = easeO(inA), sw = P(t, T.bunker, T.bunker + .2);
  $('otsw').style.display = t >= T.white ? 'block' : 'none'; $('otsw').style.opacity = String(k); $('otsw').style.transform = `translateY(${lerp(-30, 0, k)}px)`;
  $('wp').style.display = 'block'; $('bp').style.display = sw > 0 ? 'block' : 'none'; $('bp').style.opacity = String(sw);
  $('otstag').textContent = sw >= .5 ? 'BUNKER IN A BUNKER' : 'WHITEPAPER';
  // vault: outer fully drawn; on "protecting" the hub and spokes fade and the inner door draws itself (rings 0.5 s, bolts pop); on the second "bunker" a push into it
  const op = P(t, T.protecting, T.protecting + .25);
  OUT.spokes.forEach((e) => (e.style.opacity = String(1 - op))); [3, 4, 5].forEach((i) => (OUT.rings[i].style.opacity = String(1 - op)));   // the hub, spokes and the two inner rings open
  OUT.bolts.forEach((e, i) => (e.style.opacity = i >= 16 ? String(1 - op) : '1'));                                                    // bolts 16+ are the spoke knobs
  vaultParts(INN).forEach((e, i) => { const p = P(t, T.protecting + .1 + i * .03, T.protecting + .55 + i * .03); e.style.opacity = p > 0 ? '1' : '0'; e.style.strokeDashoffset = String(1 - easeO(p)); });
  INN.bolts.forEach((b, i) => (b.style.opacity = t >= T.protecting + .5 + i * .02 ? '1' : '0'));
  $('vsv').style.transform = `scale(${lerp(1, 1.35, easeIO(P(t, T.bunker2, T.bunker2 + 1.2)))})`;
  // beaker bug on "cook": pops in, bubbles rise on a loop
  const bp = P(t, T.cook, T.cook + .25); $('beaker').style.display = t >= T.cook ? 'flex' : 'none';
  $('beaker').style.transform = `scale(${bp < .6 ? lerp(0, 1.15, bp / .6) : lerp(1.15, 1, (bp - .6) / .4)})`;
  { let g = ''; for (let i = 0; i < 4; i++) { const u = ((t - T.cook) * .9 + i / 4) % 1; g += `<circle cx="${22 + 14 * Math.sin(i * 2.1 + u * 3)}" cy="${56 - 40 * u}" r="${2 + 2.5 * (1 - u)}" opacity="${1 - u}"/>`; } $('bub').innerHTML = g; }
});
