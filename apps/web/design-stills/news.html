<!doctype html><html><head><meta charset="utf-8">

<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#05070d;font-family:'Inter',sans-serif}
.studio{position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 72% 40%,#1d3a66 0%,#0d1830 45%,#05070d 100%)}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 200deg at 78% 30%,rgba(120,170,255,.06) 0 4deg,transparent 4deg 11deg);mask-image:radial-gradient(ellipse 60% 60% at 78% 30%,#000,transparent)}

.card{position:absolute;left:56px;top:54px;padding:22px 28px 20px;background:rgba(5,8,15,.55);border-left:8px solid #e30613;backdrop-filter:blur(2px)}

.card .s{margin-top:12px;font:700 22px/1 'Inter',sans-serif;letter-spacing:.24em;color:#b9c7e0;text-transform:uppercase}
.badge{display:inline-block;margin-top:16px;padding:7px 14px;background:#ffd400;color:#111;font:800 18px/1 'Inter',sans-serif;letter-spacing:.08em;transform:skewX(-8deg)}
.cutout{position:absolute;left:40px;bottom:46px;width:400px;height:400px}
.l3{position:absolute;left:470px;right:40px;bottom:96px;height:74px;display:flex;align-items:stretch;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.l3 .tag{background:#fff;color:#e30613;font:800 26px/74px 'Inter',sans-serif;padding:0 20px;letter-spacing:.06em}
.l3 .bar{flex:1;background:linear-gradient(180deg,#f2141f,#b8000a);color:#fff;font:700 38px/74px 'Oswald',sans-serif;padding:0 24px;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.l3 .sub{position:absolute;left:0;right:0;top:74px;height:34px;background:rgba(10,14,24,.92);color:#dfe6f2;font:500 18px/34px 'Inter',sans-serif;padding:0 20px;letter-spacing:.04em}
.ticker{position:absolute;left:0;right:0;bottom:0;height:46px;background:#f4f5f7;display:flex;align-items:center;box-shadow:0 -4px 14px rgba(0,0,0,.4)}
.ticker .lbl{height:100%;background:#0d1830;color:#fff;font:800 18px/46px 'Inter',sans-serif;padding:0 18px;letter-spacing:.12em}
.ticker .run{flex:1;white-space:nowrap;overflow:hidden;font:700 20px/46px 'Inter',sans-serif;color:#141821;padding-left:20px}
.ticker .run b{color:#e30613;margin:0 14px}
.live{position:absolute;right:42px;top:40px;display:flex;align-items:center;gap:10px;font:800 18px/1 'Inter',sans-serif;color:#fff;letter-spacing:.14em}
.live i{width:12px;height:12px;border-radius:50%;background:#e30613;box-shadow:0 0 12px #e30613}
.logo{position:absolute;right:42px;top:74px;width:56px;opacity:.9}
</style></head><body>
