<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fbf6e9}
.page{position:absolute;inset:0;background:#fbf6e9}
.panel{position:absolute;overflow:hidden;outline:none}
.p1{left:18px;top:18px;width:560px;height:330px;clip-path:polygon(0 0,100% 0,96% 100%,0 100%)}
.p2{left:18px;top:362px;width:540px;height:340px;clip-path:polygon(0 0,100% 0,95% 100%,0 100%)}
.p3{left:560px;top:18px;width:702px;height:684px;clip-path:polygon(20px 0,100% 0,100% 100%,0 100%)}
.dots{position:absolute;inset:0}
.cap{position:absolute;background:#ffe14d;border:4px solid #111;padding:10px 16px 8px;font:700 24px/1.1 'Comic Neue',sans-serif;text-transform:uppercase;letter-spacing:.02em;color:#111;box-shadow:5px 5px 0 #111}
.warn{left:30px;top:30px;transform:rotate(-1.5deg)}
.lab{right:40px;bottom:40px;background:#fffdf5;font-size:22px}
.title{position:absolute;left:0;width:100%;text-align:center;font:400 124px/.95 'Bangers',cursive;letter-spacing:.04em;color:#ffd21f;-webkit-text-stroke:3px #111}
.mis{position:absolute;inset:0}
.corner{position:absolute;right:28px;top:28px;width:82px;height:82px;background:#fffdf5;border:4px solid #111;display:grid;place-items:center;box-shadow:4px 4px 0 #111}
.corner img{width:62px}
.paper{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.35}
</style></head><body>
<div class="page"></div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="dCyan" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="4.5" cy="4.5" r="2.6" fill="#36a9e1"/></pattern>
    <pattern id="dCyanS" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="4.5" cy="4.5" r="3.6" fill="#1f7fbf"/></pattern>
    <pattern id="dMag" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="5" cy="5" r="3.1" fill="#e5368b"/></pattern>
    <pattern id="dGrey" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="3.5" cy="3.5" r="2" fill="#444"/></pattern>
    <pattern id="dGreyL" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="3.5" cy="3.5" r="1.2" fill="#555"/></pattern>
    <pattern id="dRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><circle cx="4" cy="4" r="2.4" fill="#c4161c"/></pattern>
    <pattern id="dYel" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(10)"><circle cx="4" cy="4" r="2.2" fill="#f2a300"/></pattern>
  </defs>
</svg>

<!-- PANEL 1: the vault -->
<div class="panel p1"><svg width="560" height="330" viewBox="0 0 560 330">
  <rect width="560" height="330" fill="#cfe9f7"/><rect width="560" height="330" fill="url(#dCyan)"/>
  <rect y="250" width="560" height="80" fill="#8fa3ad"/><rect y="250" width="560" height="80" fill="url(#dGrey)"/>
  <g stroke="#111" stroke-width="3" opacity=".5"><line x1="0" y1="80" x2="560" y2="80"/><line x1="0" y1="165" x2="560" y2="165"/><line x1="140" y1="0" x2="140" y2="80"/><line x1="420" y1="0" x2="420" y2="80"/><line x1="280" y1="80" x2="280" y2="165"/><line x1="70" y1="165" x2="70" y2="250"/><line x1="490" y1="165" x2="490" y2="250"/></g>
  <g transform="translate(300 180)">
    <ellipse cx="10" cy="128" rx="190" ry="18" fill="#111" opacity=".35"/>
    <rect x="-176" y="-60" width="34" height="40" rx="5" fill="#9aa4ab" stroke="#111" stroke-width="5"/>
    <rect x="-176" y="30" width="34" height="40" rx="5" fill="#9aa4ab" stroke="#111" stroke-width="5"/>
    <circle r="150" fill="#b9c3c9" stroke="#111" stroke-width="7"/>
    <path d="M-150,0 A150,150 0 0 0 106,106 A150,150 0 0 1 -150,0 Z" fill="url(#dGrey)"/>
    <circle r="150" fill="url(#dGreyL)" opacity=".5"/>
    <circle r="118" fill="none" stroke="#111" stroke-width="5"/>
    <g fill="#e9eef1" stroke="#111" stroke-width="3">
      <circle cx="0" cy="-134" r="7"/><circle cx="0" cy="134" r="7"/><circle cx="-134" cy="0" r="7"/><circle cx="134" cy="0" r="7"/>
      <circle cx="95" cy="-95" r="7"/><circle cx="-95" cy="95" r="7"/><circle cx="-95" cy="-95" r="7"/><circle cx="95" cy="95" r="7"/>
    </g>
    <g stroke="#111" stroke-width="16" stroke-linecap="round"><line x1="0" y1="0" x2="0" y2="-78"/><line x1="0" y1="0" x2="68" y2="39"/><line x1="0" y1="0" x2="-68" y2="39"/></g>
    <g stroke="#e9eef1" stroke-width="8" stroke-linecap="round"><line x1="0" y1="0" x2="0" y2="-78"/><line x1="0" y1="0" x2="68" y2="39"/><line x1="0" y1="0" x2="-68" y2="39"/></g>
    <circle r="54" fill="none" stroke="#111" stroke-width="14"/><circle r="54" fill="none" stroke="#e9eef1" stroke-width="6"/>
    <circle r="22" fill="#ffd21f" stroke="#111" stroke-width="5"/>
    <path d="M-120,-70 A140,140 0 0 1 -40,-128" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g stroke="#111" stroke-width="4" stroke-linecap="round"><line x1="500" y1="70" x2="540" y2="52"/><line x1="506" y1="100" x2="548" y2="98"/><line x1="500" y1="128" x2="536" y2="142"/></g>
</svg></div>

<!-- PANEL 2: the devil -->
<div class="panel p2"><svg width="540" height="340" viewBox="0 0 540 340">
  <rect width="540" height="340" fill="#ffe7ef"/><rect width="540" height="340" fill="url(#dMag)" opacity=".75"/>
  <g transform="translate(270 172)">
    <polygon fill="#ffd21f" stroke="#111" stroke-width="6" stroke-linejoin="round"
      points="0,-160 38,-96 112,-142 92,-62 196,-70 120,-12 230,40 112,46 150,128 62,86 34,170 -14,96 -84,156 -84,74 -196,104 -118,30 -232,-28 -116,-46 -170,-128 -76,-92 -54,-158 -18,-100"/>
    <polygon fill="url(#dYel)" opacity=".7" points="112,46 150,128 62,86 34,170 -14,96 -84,156 -84,74 0,40"/>
    <polygon fill="#fff4b3" points="0,-120 26,-70 -22,-70" opacity=".7"/>
  </g>
  <!-- stick-figure devil -->
  <g transform="translate(300 178)" stroke="#111" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-30,-82 C-40,-104 -36,-118 -24,-126 C-28,-112 -22,-98 -14,-90" fill="#c4161c" stroke-width="4"/>
    <path d="M30,-82 C40,-104 36,-118 24,-126 C28,-112 22,-98 14,-90" fill="#c4161c" stroke-width="4"/>
    <circle cx="0" cy="-64" r="34" fill="#e8232a" stroke-width="5"/>
    <circle cx="0" cy="-64" r="34" fill="url(#dRed)" opacity=".45" stroke="none"/>
    <path d="M-20,-76 L-6,-70 M20,-76 L6,-70" stroke-width="5"/>
    <circle cx="-11" cy="-64" r="3.5" fill="#111"/><circle cx="11" cy="-64" r="3.5" fill="#111"/>
    <path d="M-17,-50 C-8,-38 8,-38 17,-50" stroke-width="4" fill="#fff"/>
    <path d="M-17,-50 L17,-50" stroke-width="3"/>
    <line x1="0" y1="-30" x2="0" y2="40" stroke-width="7"/>
    <path d="M0,-12 L-42,-34 L-58,-58" stroke-width="7"/>
    <path d="M0,-12 L44,4" stroke-width="7"/>
    <path d="M0,40 L-30,96 M0,40 L28,96" stroke-width="7"/>
    <path d="M0,40 C26,50 40,40 52,30 L60,40 L48,18 L44,32" stroke-width="5" stroke="#c4161c"/>
    <line x1="58" y1="-70" x2="34" y2="90" stroke-width="6"/>
    <path d="M46,-84 L52,-66 M58,-90 L58,-68 M70,-86 L64,-66 M44,-66 L72,-66" stroke-width="6"/>
  </g>
  <g transform="translate(26 112) rotate(-12)">
    <text font-family="Bangers" font-size="92" fill="#111" x="5" y="6">POW!</text>
    <text font-family="Bangers" font-size="92" fill="#e8232a" stroke="#111" stroke-width="3" paint-order="stroke">POW!</text>
  </g>
  <g stroke="#111" stroke-width="4" stroke-linecap="round"><line x1="430" y1="262" x2="490" y2="300"/><line x1="410" y1="286" x2="452" y2="326"/><line x1="452" y1="236" x2="520" y2="262"/></g>
</svg></div>

<!-- PANEL 3: title -->
<div class="panel p3"><svg width="702" height="684" viewBox="0 0 702 684">
  <rect width="702" height="684" fill="#c4161c"/>
  <g transform="translate(330 330)" fill="#e8232a">
    <path id="sl" d="M0,0 L-30,-900 L30,-900 Z"/>
    <use href="#sl" transform="rotate(15)"/><use href="#sl" transform="rotate(30)"/><use href="#sl" transform="rotate(45)"/><use href="#sl" transform="rotate(60)"/><use href="#sl" transform="rotate(75)"/><use href="#sl" transform="rotate(90)"/><use href="#sl" transform="rotate(105)"/><use href="#sl" transform="rotate(120)"/><use href="#sl" transform="rotate(135)"/><use href="#sl" transform="rotate(150)"/><use href="#sl" transform="rotate(165)"/><use href="#sl" transform="rotate(180)"/><use href="#sl" transform="rotate(195)"/><use href="#sl" transform="rotate(210)"/><use href="#sl" transform="rotate(225)"/><use href="#sl" transform="rotate(240)"/><use href="#sl" transform="rotate(255)"/><use href="#sl" transform="rotate(270)"/><use href="#sl" transform="rotate(285)"/><use href="#sl" transform="rotate(300)"/><use href="#sl" transform="rotate(315)"/><use href="#sl" transform="rotate(330)"/><use href="#sl" transform="rotate(345)"/>
  </g>
  <rect width="702" height="684" fill="url(#dYel)" opacity=".35"/>
  <!-- jagged speech bubble -->
  <g transform="translate(356 318) scale(1.08)">
    <polygon fill="#111" transform="translate(9 9)" points="-300,-40 -262,-120 -180,-104 -150,-178 -60,-140 0,-196 58,-142 140,-182 166,-108 262,-128 250,-50 320,-14 260,40 300,112 200,108 176,178 96,132 30,184 -24,140 -70,158 -262,318 -150,140 -230,132 -210,62 -320,40 -262,-2"/>
    <polygon fill="#fff" stroke="#111" stroke-width="6" stroke-linejoin="round" points="-300,-40 -262,-120 -180,-104 -150,-178 -60,-140 0,-196 58,-142 140,-182 166,-108 262,-128 250,-50 320,-14 260,40 300,112 200,108 176,178 96,132 30,184 -24,140 -70,158 -262,318 -150,140 -230,132 -210,62 -320,40 -262,-2"/>
  </g>
</svg>
  <div class="title" style="top:182px;left:14px">
    <div style="position:relative;display:inline-block;transform:rotate(-4deg)">
      <span style="position:absolute;left:9px;top:5px;color:#33b5e5;-webkit-text-stroke:0;mix-blend-mode:multiply;opacity:.9">SOLANA<br>BUNKER!</span>
      <span style="position:absolute;left:-6px;top:-4px;color:#ec3e96;-webkit-text-stroke:0;mix-blend-mode:multiply;opacity:.75">SOLANA<br>BUNKER!</span>
      <span style="position:relative;font-size:inherit;color:#ffd21f;text-shadow:6px 6px 0 #111;paint-order:stroke fill">SOLANA<br>BUNKER!</span>
    </div>
  </div>
  <div class="cap lab">Chaintail Labs R&amp;D</div>
  <div class="corner"><img src="../../../docs/presentation/assets/chaintail-logo.svg"></div>
</div>

<div class="cap warn">WARNING: CONTAINS MATH</div>
<svg class="paper" width="1280" height="720"><filter id="pp"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .48 0 0 0 0 .35 0 0 0 .9 -.2"/></filter><rect width="1280" height="720" filter="url(#pp)"/></svg>
<!-- thick panel borders drawn on top -->
<svg style="position:absolute;inset:0" width="1280" height="720" fill="none" stroke="#111" stroke-width="7" stroke-linejoin="round">
  <polygon points="18,18 578,18 555.6,348 18,348"/>
  <polygon points="18,362 558,362 531,702 18,702"/>
  <polygon points="580,18 1262,18 1262,702 560,702"/>
</svg>
</body></html>
