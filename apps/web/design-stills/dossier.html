<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Libre+Caslon+Display&family=Archivo:wdth,wght@62..125,700..900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0e0b09}
.desk{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 45%,#2a2018 0%,#15100c 60%,#080605 100%)}
.desk svg{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:overlay;opacity:.55}
.lamp{position:absolute;inset:0;background:radial-gradient(ellipse 45% 40% at 48% 42%,rgba(255,214,150,.16),transparent 70%)}
.folder{position:absolute;left:250px;top:110px;width:780px;height:520px;transform:rotate(-3.2deg);filter:drop-shadow(0 30px 34px rgba(0,0,0,.75)) drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.tab{position:absolute;left:470px;top:-34px;width:230px;height:46px;background:#cdb57e;border-radius:10px 10px 0 0}
.back{position:absolute;inset:0;background:#c9b078;border-radius:4px}
.front{position:absolute;inset:0;background:linear-gradient(170deg,#e6d4a3 0%,#d9c38c 55%,#ccb47a 100%);border-radius:4px;overflow:hidden}
.front svg{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;opacity:.55}
.front::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 60px rgba(90,60,20,.35)}
.crease{position:absolute;left:0;right:0;top:64px;height:2px;background:rgba(120,90,40,.35);box-shadow:0 1px 0 rgba(255,255,255,.35)}
.label{position:absolute;left:70px;top:150px;width:520px;padding:22px 30px 20px;background:#f4ecd8;box-shadow:0 2px 3px rgba(0,0,0,.25);transform:rotate(.6deg)}
.label::before{content:"";position:absolute;inset:6px;border:1.5px solid rgba(40,30,20,.55)}
.label .k{font:400 13px/1 'Courier Prime',monospace;letter-spacing:.32em;color:#5a4e3c}
.label .t{margin-top:12px;font:400 64px/1 'Libre Caslon Display',serif;letter-spacing:.06em;color:#1c1a17}
.label .s{margin-top:12px;font:700 20px/1 'Courier Prime',monospace;letter-spacing:.18em;color:#3a3226}
.file{position:absolute;left:72px;top:380px;font:400 15px/1.6 'Courier Prime',monospace;color:#4c4030;letter-spacing:.12em}
.stamp{position:absolute;right:46px;top:34px;transform:rotate(9deg);padding:10px 22px 8px;border:6px solid #b3242a;border-radius:6px;font:900 54px/1 'Archivo',sans-serif;font-stretch:80%;letter-spacing:.08em;color:#b3242a;opacity:.86;mix-blend-mode:multiply}
.stamp::after{content:"";position:absolute;inset:3px;border:2px solid #b3242a}
.note{position:absolute;left:790px;top:400px;width:330px;padding:34px 28px 30px;background:#fbf8ef;transform:rotate(5deg);box-shadow:0 14px 22px rgba(0,0,0,.45);
  clip-path:polygon(0 4%,8% 0,22% 3%,38% 0,55% 2%,70% 0,86% 3%,100% 0,100% 100%,92% 97%,80% 100%,64% 96%,50% 100%,34% 97%,18% 100%,6% 96%,0 100%);
  font:400 34px/1.15 'Special Elite',monospace;color:#1d1b18}
.note small{display:block;margin-top:10px;font-size:16px;letter-spacing:.2em;color:#7a2020}
.clip{position:absolute;left:1075px;top:372px;transform:rotate(6deg);filter:drop-shadow(2px 4px 3px rgba(0,0,0,.45))}
.logo{position:absolute;right:40px;bottom:30px;width:74px;opacity:.9;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
</style></head><body>
<div class="desk"><svg><filter id="w"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.12" numOctaves="4" seed="4"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .36 0 0 0 0 .22 0 0 0 1.6 -.3"/></filter><rect width="100%" height="100%" filter="url(#w)"/></svg></div>
<div class="lamp"></div>
<div class="folder">
  <div class="tab"></div><div class="back"></div>
  <div class="front">
    <svg><filter id="p"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="2"/><feColorMatrix values="0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .15 0 0 0 .9 -.25"/></filter><rect width="100%" height="100%" filter="url(#p)"/></svg>
    <div class="crease"></div>
    <div class="label"><div class="k">SUBJECT · FILE NO. 001</div><div class="t">SOLANA BUNKER</div><div class="s">Chaintail Labs R&amp;D</div></div>
    <div class="file">CLEARANCE: EYES ONLY<br>ORIGIN: DEVNET<br>CONTENTS: ONE VAULT, BUILT THREE TIMES</div>
    <div class="stamp">CLASSIFIED</div>
  </div>
</div>
<div class="note">WARNING:<br>CONTAINS<br>MATH<small>— handle with care</small></div>
<svg class="clip" width="60" height="150" viewBox="0 0 60 150"><path d="M18,140 L18,30 A12,12 0 0 1 42,30 L42,120 A8,8 0 0 1 26,120 L26,40" fill="none" stroke="#c9ccd2" stroke-width="5" stroke-linecap="round"/><path d="M18,140 L18,30 A12,12 0 0 1 42,30 L42,120 A8,8 0 0 1 26,120 L26,40" fill="none" stroke="#7e828a" stroke-width="1.5" stroke-linecap="round" transform="translate(1,1)" opacity=".7"/></svg>
<img class="logo" src="../../../docs/presentation/assets/chaintail-logo.svg">
</body></html>
